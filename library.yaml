default_dirs:
  skills:
    - default: .claude/skills/
    - global: ~/.claude/skills/
  agents:
    - default: .claude/agents/
    - global: ~/.claude/agents/
  prompts:
    - default: .claude/commands/
    - global: ~/.claude/commands/

library:
  skills:
    - name: ticketing
      description: Filesystem-based ticket tracker for creating, listing, moving, and searching markdown tickets in backlog/in-progress/done buckets
      source: https://github.com/coryvirok/ticketing-skill/blob/main/SKILL.md
  agents: []
  prompts: []
